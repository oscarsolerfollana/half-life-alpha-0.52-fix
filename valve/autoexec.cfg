// Controls for half-life-alpha-0.52-fix. Replaces the CD's autoexec.cfg.
// The engine runs it at startup, after default.cfg and config.cfg, so
// these keys override whatever config.cfg has saved.
//
// Keys: WASD to move, mouse to aim, C/CTRL crouch, E use, Q previous
// weapon, 1-3 weapons (crowbar, pistol, MP5). F6/F7 quicksave and
// quickload (slot s11, the last one in the menu).

unbindall

bind "TAB" "+showscores"
bind "ENTER" "messagemode"
bind "ESCAPE" "cancelselect"
bind "SPACE" "+jump"
bind "+" "sizeup"
bind "," "+moveleft"
bind "-" "sizedown"
bind "." "+moveright"
bind "/" "impulse 10"
bind "0" "play player/hoot6.wav"
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "5" "play player/hoot1.wav"
bind "6" "play player/hoot2.wav"
bind "7" "play player/hoot3.wav"
bind "8" "play player/hoot4.wav"
bind "9" "play player/hoot5.wav"
bind ";" "+mlook"
bind "=" "sizeup"
bind "\" "+mlook"
bind "`" "toggleconsole"
bind "a" "+moveleft"
bind "b" "+use"
bind "c" "+duck"
bind "d" "+moveright"
bind "e" "+use"
bind "f" "impulse 100"
bind "g" "god"
bind "l" "impulse 200"
bind "m" "notarget"
bind "n" "noclip"
bind "q" "lastinv"
bind "s" "+back"
bind "t" "impulse 201"
bind "u" "messagemode2"
bind "w" "+forward"
bind "y" "messagemode"
bind "z" "+lookdown"
bind "~" "toggleconsole"
bind "BACKSPACE" "cd stop"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+moveleft"
bind "RIGHTARROW" "+moveright"
bind "ALT" "+strafe"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "F1" "help"
bind "F2" "menu_save"
bind "F3" "menu_load"
bind "F4" "menu_options"
bind "F6" "echo Quicksaving...; wait; save s11"
bind "F7" "echo Quickloading...; wait; load s11"
bind "F10" "quit"
bind "F11" "zoom_in"
bind "F5" "screenshot"
bind "INS" "+klook"
bind "DEL" "+lookdown"
bind "PGDN" "+lookdown"
bind "PGUP" "+lookup"
bind "END" "centerview"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "impulse 201"
bind "PAUSE" "pause"

// mouse
sensitivity "3"
m_pitch "0.022"
m_yaw "0.022"
m_forward "1"
m_side "0.8"
lookstrafe "0"
lookspring "0"

// mouselook (without it, moving the mouse up/down walks).
// It must be on its own line, with a newline at the end.
+mlook
